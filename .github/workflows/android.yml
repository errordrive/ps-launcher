name: Android CI — PS Launcher

# MANUAL ONLY — do NOT run on push.
# File uploads go one-by-one via the Contents API, and every push
# would start a build on an incomplete tree and show an error.
# Trigger this once, from the Actions tab (or API dispatch),
# AFTER all files are uploaded and updated.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT use android-actions/setup-android@v3 here.
      # It failed twice (runs 42875395034, 42875721450):
      # it passes its `packages` input to sdkmanager as ONE
      # package name with embedded newlines —
      # "Failed to find package 'platform-tools\nplatforms;android-34\nbuild-tools;34.0.0'"
      # The runner already has an Android SDK preinstalled
      # (ANDROID_HOME=/usr/local/lib/android/sdk), so install
      # the exact SDK 34 pieces with sdkmanager directly,
      # each package as its own quoted argument.
      - name: Install Android SDK 34
        run: |
          # AUDIT FIX: ANDROID_HOME is not guaranteed to be set in a
          # run step, and cmdline-tools/latest is the preinstalled
          # one — resolve both defensively instead of hardcoding.
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_HOME=$SDK_HOME"
          # AUDIT FIX #2: my earlier find used -maxdepth 2, but
          # sdkmanager lives at cmdline-tools/latest/bin/sdkmanager
          # (depth 4) — the find returned empty and `test -x ""`
          # failed the step in 8 seconds (run 42876285564).
          SDKMANAGER="$SDK_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -name sdkmanager -type f | sort | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        # No gradle wrapper in the repo — use the installed Gradle.
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ps-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
